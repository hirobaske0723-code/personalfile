<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目標管理</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, 'Hiragino Kaku Gothic ProN', 'BIZ UDGothic', sans-serif;
  background: #080c14;
  background-image:
    radial-gradient(ellipse at 15% 0%, rgba(59,130,246,0.06) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 10%, rgba(168,85,247,0.05) 0%, transparent 55%);
  min-height: 100vh;
  color: #f0f0f0;
  padding-bottom: 80px;
}

/* ── Header ── */
.page-header {
  background: linear-gradient(135deg, #1a2744 0%, #0f1a2e 100%);
  padding: 28px 16px 24px;
  text-align: center;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: rgba(255,255,255,0.4);
  text-decoration: none;
  font-size: 0.8rem;
  margin-bottom: 12px;
}
.back-link:hover { color: rgba(255,255,255,0.7); }
.page-header h1 {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.page-header .subtitle {
  font-size: 0.75rem;
  color: rgba(255,255,255,0.3);
  margin-top: 4px;
}
.stats {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 14px;
}
.stat { text-align: center; }
.stat-num {
  font-size: 1.5rem;
  font-weight: 700;
  color: #5eead4;
  font-variant-numeric: tabular-nums;
}
.stat-label {
  font-size: 0.65rem;
  color: rgba(255,255,255,0.3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* ── Token Setup ── */
#token-setup {
  max-width: 480px;
  margin: 40px auto;
  padding: 0 16px;
}
.token-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 24px;
}
.token-card h2 { font-size: 1rem; margin-bottom: 8px; }
.token-card p { font-size: 0.8rem; color: rgba(255,255,255,0.4); margin-bottom: 16px; line-height: 1.6; }
.token-input {
  width: 100%;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  color: #f0f0f0;
  padding: 12px 14px;
  font-size: 0.85rem;
  margin-bottom: 12px;
  font-family: monospace;
}
.token-input:focus { outline: none; border-color: rgba(94,234,212,0.5); }
.btn-primary {
  width: 100%;
  background: rgba(20,184,166,0.2);
  border: 1px solid rgba(20,184,166,0.5);
  border-radius: 10px;
  color: #5eead4;
  padding: 12px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
}
.btn-primary:hover { background: rgba(20,184,166,0.3); }

/* ── Main ── */
#main-content { max-width: 560px; margin: 0 auto; padding: 24px 16px 0; display: flex; flex-direction: column; gap: 14px; }

.error-msg {
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: 10px;
  color: #fca5a5;
  font-size: 0.8rem;
  padding: 10px 14px;
  margin-bottom: 4px;
  display: none;
}
.error-msg.show { display: block; }

/* ── Goal card ── */
.goal-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  overflow: hidden;
  border-left: 3px solid transparent;
  transition: background 0.15s;
}
.goal-card[data-accent="weight"]   { border-left-color: #f97316; }
.goal-card[data-accent="hyrox"]    { border-left-color: #f43f5e; }
.goal-card[data-accent="marathon"] { border-left-color: #3b82f6; }
.goal-card[data-accent="fuji"]     { border-left-color: #10b981; }

.goal-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 16px 16px 14px;
  cursor: pointer;
  user-select: none;
}
.goal-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  flex-shrink: 0;
}
.goal-card[data-accent="weight"]   .goal-icon { background: rgba(249,115,22,0.15); }
.goal-card[data-accent="hyrox"]    .goal-icon { background: rgba(244,63,94,0.15); }
.goal-card[data-accent="marathon"] .goal-icon { background: rgba(59,130,246,0.15); }
.goal-card[data-accent="fuji"]     .goal-icon { background: rgba(16,185,129,0.15); }

.goal-titles { flex: 1; min-width: 0; }
.goal-titles h3 { font-size: 0.94rem; font-weight: 600; margin-bottom: 3px; }
.goal-sub { font-size: 0.74rem; color: rgba(255,255,255,0.38); line-height: 1.4; }

.goal-status {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  padding: 3px 9px;
  border-radius: 20px;
  white-space: nowrap;
  flex-shrink: 0;
}
.goal-status.active  { background: rgba(94,234,212,0.14); color: #5eead4; border: 1px solid rgba(94,234,212,0.35); }
.goal-status.pending { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.12); }

.chevron {
  color: rgba(255,255,255,0.2);
  font-size: 0.75rem;
  transition: transform 0.2s;
  flex-shrink: 0;
}
.goal-card.open .chevron { transform: rotate(90deg); }

/* ── weekly progress dots ── */
.week-track {
  display: flex;
  gap: 3px;
  padding: 0 16px 14px 66px;
}
.week-dot {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: rgba(255,255,255,0.08);
}
.week-dot.filled  { background: var(--dot-color, #3b82f6); }
.week-dot.current { background: var(--dot-color, #3b82f6); opacity: 0.55; box-shadow: 0 0 0 2px rgba(255,255,255,0.06); }

/* ── body (collapsible) ── */
.goal-body {
  display: none;
  padding: 2px 16px 16px;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.goal-card.open .goal-body { display: block; }

.milestone-note {
  font-size: 0.76rem;
  color: rgba(255,255,255,0.45);
  background: rgba(255,255,255,0.03);
  border-radius: 10px;
  padding: 10px 12px;
  margin: 12px 0;
  line-height: 1.6;
}

.week-block { margin-top: 14px; }
.week-block:first-child { margin-top: 12px; }
.week-block.is-current { position: relative; }
.week-block-label {
  font-size: 0.68rem;
  font-weight: 700;
  color: rgba(255,255,255,0.32);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.week-block.is-current .week-block-label { color: #5eead4; }
.week-block-label .range { font-weight: 400; text-transform: none; letter-spacing: 0; color: rgba(255,255,255,0.22); }
.now-badge {
  font-size: 0.58rem;
  font-weight: 700;
  background: rgba(94,234,212,0.16);
  color: #5eead4;
  border-radius: 8px;
  padding: 1px 6px;
  letter-spacing: 0.04em;
}

.task-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 4px;
}
.task-check {
  width: 19px;
  height: 19px;
  border-radius: 50%;
  border: 2px solid rgba(94,234,212,0.4);
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  color: #5eead4;
  transition: all 0.15s;
}
.task-item.done .task-check {
  background: rgba(20,184,166,0.3);
  border-color: rgba(94,234,212,0.6);
}
.task-text { font-size: 0.84rem; line-height: 1.4; color: rgba(255,255,255,0.85); }
.task-item.done .task-text { text-decoration: line-through; color: rgba(255,255,255,0.35); }

.pending-note {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.3);
  text-align: center;
  padding: 14px 0 6px;
}

.settings-link {
  text-align: center;
  margin-top: 20px;
}
.settings-link button {
  background: none;
  border: none;
  color: rgba(255,255,255,0.2);
  font-size: 0.75rem;
  cursor: pointer;
}
.settings-link button:hover { color: rgba(255,255,255,0.4); }

#saving {
  position: fixed;
  bottom: 16px;
  right: 16px;
  background: rgba(15,30,50,0.9);
  border: 1px solid rgba(20,184,166,0.4);
  border-radius: 10px;
  color: #5eead4;
  font-size: 0.78rem;
  padding: 8px 14px;
  display: none;
  align-items: center;
  gap: 6px;
  backdrop-filter: blur(8px);
}
#saving.show { display: flex; }
</style>
</head>
<body>

<div class="page-header">
  <a href="index.html" class="back-link">&#x2190; BASE</a>
  <h1>&#x1F3AF; 目標管理</h1>
  <div class="subtitle">健康的な身体を手に入れる</div>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Goals</div></div>
    <div class="stat"><div class="stat-num" id="stat-active">0</div><div class="stat-label">進行中</div></div>
    <div class="stat"><div class="stat-num" id="stat-pending">0</div><div class="stat-label">保留</div></div>
  </div>
</div>

<!-- Token Setup -->
<div id="token-setup" style="display:none;">
  <div class="token-card">
    <h2>&#x1F511; GitHub Token を設定</h2>
    <p>目標の進捗をどのデバイスからでも同期するために、GitHub Personal Access Token（repoスコープ）が必要です。帰国後やることリストと同じトークンを使えます。一度設定するとこのブラウザに保存されます。</p>
    <div class="error-msg" id="token-error"></div>
    <input type="password" class="token-input" id="token-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    <button class="btn-primary" onclick="saveToken()">設定して開始</button>
  </div>
</div>

<!-- Main -->
<div id="main-content" style="display:none;">
  <div class="error-msg" id="main-error"></div>
  <div id="goal-list"></div>
  <div class="settings-link">
    <button onclick="resetToken()">&#x2699; Tokenを変更</button>
  </div>
</div>

<div id="saving">&#x23F3; 保存中…</div>

<script>
const REPO      = 'hirobaske0723-code/return-todo';
const FILE_PATH = 'goals-data.json';
const API_BASE  = 'https://api.github.com';
const TOKEN_KEY = 'gh_token_return_todo'; // return-todo.htmlと同じトークンを共用

// ── 目標定義（静的） ──
const GOALS = [
  {

    milestone: '現在73.2kg。週あたり約0.46kgペースで70kgを目指す。毎週同じ5習慣を継続し、週末に目安体重と比較する。',
    weeks: [
      { start: '2026-07-15', end: '2026-07-21', label: 'Week 1', note: '目安 72.7kg', tasks: weightTasks('w1', '72.7kg') },
      { start: '2026-07-22', end: '2026-07-28', label: 'Week 2', note: '目安 72.3kg', tasks: weightTasks('w2', '72.3kg') },
      { start: '2026-07-29', end: '2026-08-04', label: 'Week 3', note: '目安 71.8kg', tasks: weightTasks('w3', '71.8kg') },
      { start: '2026-08-05', end: '2026-08-11', label: 'Week 4', note: '目安 71.4kg', tasks: weightTasks('w4', '71.4kg') },
      { start: '2026-08-12', end: '2026-08-18', label: 'Week 5', note: '目安 70.9kg', tasks: weightTasks('w5', '70.9kg') },
      { start: '2026-08-19', end: '2026-08-25', label: 'Week 6', note: '目安 70.5kg', tasks: weightTasks('w6', '70.5kg') },
      { start: '2026-08-26', end: '2026-08-31', label: 'Week 7', note: '目安 70.0kg（本番週）', tasks: weightTasks('w7', '70.0kg（8/31達成確認）') },
    ]
  },
  {
    id: 'marathon', accent: 'marathon', icon: '🏃',
    title: '③ 横浜マラソンを走る',

    status: 'active',
    milestone: '現状ランニングほぼ0スタート。1.5km→2.0km→2.5kmと距離を伸ばし、8/31に5km・35分（キロ7分ペース）を目指す。',
    weeks: [
      { start: '2026-07-15', end: '2026-07-21', label: 'Week 1', note: '1.5km定着', tasks: [
        { id: 'mara-w1-0', text: '1.5kmを週1〜2回走る（完走重視）' },
        { id: 'mara-w1-1', text: '走った後に軽くストレッチをする' },
      ]},
      { start: '2026-07-22', end: '2026-07-28', label: 'Week 2', note: '2.0kmへ', tasks: [
        { id: 'mara-w2-0', text: '2.0kmを週1〜2回走る' },
      ]},
      { start: '2026-07-29', end: '2026-08-04', label: 'Week 3', note: '2.5kmへ', tasks: [
        { id: 'mara-w3-0', text: '2.5kmを週1〜2回走る' },
      ]},
      { start: '2026-08-05', end: '2026-08-11', label: 'Week 4', note: '3.0〜3.5kmへ', tasks: [
        { id: 'mara-w4-0', text: '3.0〜3.5kmを週1〜2回走る' },
      ]},
      { start: '2026-08-12', end: '2026-08-18', label: 'Week 5', note: '4.0kmへ', tasks: [
        { id: 'mara-w5-0', text: '4.0kmを週1〜2回走る' },
      ]},
      { start: '2026-08-19', end: '2026-08-25', label: 'Week 6', note: '4.5〜5.0kmへ', tasks: [
        { id: 'mara-w6-0', text: '4.5〜5.0kmを週1〜2回走る' },
      ]},
      { start: '2026-08-26', end: '2026-08-31', label: 'Week 7', note: '本番トライ', tasks: [
        { id: 'mara-w7-0', text: '5kmを通しで走り、35分切れるかタイム計測' },
      ]},
    ]
  },
  {
    id: 'hyrox', accent: 'hyrox', icon: '🔥',
    title: '② HYROXに出場する',
    sub: '①がある程度進んでから開始',
    status: 'pending',
    pendingNote: 'ジム訪問後にタスクを設計予定',
  },
  {
    id: 'fuji', accent: 'fuji', icon: '🗻',
    title: '④ 富士山登頂する',
    sub: '時期・タスク未設計',
    status: 'pending',
    pendingNote: '目標のみ設定・今後詳細を詰める',
  },
];

function weightTasks(wk, weighInLabel) {
  return [
    { id: 'weight-' + wk + '-0', text: 'タンパク質 体重×1.6〜2g/日を意識する' },
    { id: 'weight-' + wk + '-1', text: '摂取カロリーをやや抑える（緩やかな減量ペース）' },
    { id: 'weight-' + wk + '-2', text: '筋トレを週2〜3回（スクワット・デッドリフト中心）' },
    { id: 'weight-' + wk + '-3', text: '有酸素運動を週1回組み込む' },
    { id: 'weight-' + wk + '-4', text: '週末に体重測定・' + weighInLabel + 'と比較' },
  ];
}

const ACCENT_COLOR = { weight: '#f97316', hyrox: '#f43f5e', marathon: '#3b82f6', fuji: '#10b981' };

let doneTasks = new Set();
let openCards = new Set(['weight', 'marathon']); // 初期は進行中2つを開く
let fileSha   = '';
let token     = '';
let saveTimer = null;

// ── UTF-8 safe base64 ──
function b64decode(str) {
  const binaryStr = atob(str.replace(/\n/g, ''));
  const bytes = new Uint8Array(binaryStr.length);
  for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function b64encode(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

// ── Init ──
window.addEventListener('DOMContentLoaded', function() {
  token = localStorage.getItem(TOKEN_KEY) || '';
  if (!token) {
    document.getElementById('token-setup').style.display = 'block';
  } else {
    loadGoals();
  }
});

// ── Token ──
async function saveToken() {
  const input = document.getElementById('token-input').value.trim();
  if (!input) return;
  token = input;
  const err = document.getElementById('token-error');
  err.classList.remove('show');
  try {
    await fetchGoals(token);
    localStorage.setItem(TOKEN_KEY, token);
    document.getElementById('token-setup').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    render();
  } catch(e) {
    err.textContent = 'Token が無効か権限がありません。repoスコープを確認してください。';
    err.classList.add('show');
  }
}
function resetToken() {
  localStorage.removeItem(TOKEN_KEY);
  location.reload();
}

// ── Load ──
async function loadGoals() {
  try {
    await fetchGoals(token);
    document.getElementById('main-content').style.display = 'block';
    render();
  } catch(e) {
    localStorage.removeItem(TOKEN_KEY);
    document.getElementById('token-setup').style.display = 'block';
  }
}

async function fetchGoals(t) {
  const res = await fetch(API_BASE + '/repos/' + REPO + '/contents/' + FILE_PATH, {
    headers: { Authorization: 'token ' + t, Accept: 'application/vnd.github.v3+json' }
  });
  if (res.status === 404) {
    doneTasks = new Set();
    fileSha   = '';
    return;
  }
  if (!res.ok) throw new Error('fetch failed');
  const data    = await res.json();
  fileSha       = data.sha;
  const decoded = b64decode(data.content);
  const parsed  = JSON.parse(decoded);
  doneTasks = new Set(parsed.doneTasks || []);
}

// ── Save ──
function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveGoals, 800);
}
async function saveGoals() {
  const saving = document.getElementById('saving');
  saving.classList.add('show');
  try {
    const json    = JSON.stringify({ doneTasks: Array.from(doneTasks) }, null, 2);
    const encoded = b64encode(json);
    const res = await fetch(API_BASE + '/repos/' + REPO + '/contents/' + FILE_PATH, {
      method: 'PUT',
      headers: {
        Authorization:  'token ' + token,
        Accept:         'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(Object.assign(
        { message: 'update goals progress', content: encoded },
        fileSha ? { sha: fileSha } : {}
      ))
    });
    if (!res.ok) throw new Error('save failed');
    const data = await res.json();
    fileSha = data.content.sha;
  } catch(e) {
    const err = document.getElementById('main-error');
    err.textContent = '保存に失敗しました。通信状況を確認してください。';
    err.classList.add('show');
    setTimeout(() => err.classList.remove('show'), 4000);
  } finally {
    saving.classList.remove('show');
  }
}

// ── Week helpers ──
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function currentWeekIndex(weeks) {
  const today = todayStr();
  for (let i = 0; i < weeks.length; i++) {
    if (today >= weeks[i].start && today <= weeks[i].end) return i;
  }
  if (today < weeks[0].start) return 0;
  return weeks.length - 1;
}

// ── Toggle ──
function toggleCard(id) {
  if (openCards.has(id)) openCards.delete(id); else openCards.add(id);
  render();
}
function toggleTask(id) {
  if (doneTasks.has(id)) doneTasks.delete(id); else doneTasks.add(id);
  render();
  scheduleSave();
}

// ── Render ──
function render() {
  const active  = GOALS.filter(g => g.status === 'active').length;
  const pending = GOALS.filter(g => g.status === 'pending').length;
  document.getElementById('stat-total').textContent   = GOALS.length;
  document.getElementById('stat-active').textContent  = active;
  document.getElementById('stat-pending').textContent = pending;

  const list = document.getElementById('goal-list');
  list.innerHTML = GOALS.map(goalHTML).join('');
}

function goalHTML(g) {
  const isOpen = openCards.has(g.id);
  const color  = ACCENT_COLOR[g.accent];

  let weekTrackHTML = '';
  let bodyInner = '';

  if (g.status === 'active') {
    const curIdx = currentWeekIndex(g.weeks);
    weekTrackHTML = '<div class="week-track" style="--dot-color:' + color + '">' +
      g.weeks.map((w, i) => {
        const cls = i < curIdx ? 'filled' : (i === curIdx ? 'current filled' : '');
        return '<div class="week-dot ' + cls + '"></div>';
      }).join('') +
    '</div>';

    bodyInner = '<div class="milestone-note">' + escHtml(g.milestone) + '</div>' +
      g.weeks.map((w, i) => {
        const isCur = i === curIdx;
        return '<div class="week-block' + (isCur ? ' is-current' : '') + '">' +
          '<div class="week-block-label">' + w.label +
            (isCur ? ' <span class="now-badge">今週</span>' : '') +
            ' <span class="range">' + formatRange(w.start, w.end) + '・' + escHtml(w.note) + '</span>' +
          '</div>' +
          w.tasks.map(taskHTML).join('') +
        '</div>';
      }).join('');
  } else {
    bodyInner = '<div class="pending-note">' + escHtml(g.pendingNote) + '</div>';
  }

  return '<div class="goal-card' + (isOpen ? ' open' : '') + '" data-accent="' + g.accent + '">' +
    '<div class="goal-head" onclick="toggleCard(\'' + g.id + '\')">' +
      '<div class="goal-icon">' + g.icon + '</div>' +
      '<div class="goal-titles"><h3>' + escHtml(g.title) + '</h3><div class="goal-sub">' + escHtml(g.sub) + '</div></div>' +
      '<div class="goal-status ' + g.status + '">' + (g.status === 'active' ? '進行中' : '保留') + '</div>' +
      '<div class="chevron">&#x276F;</div>' +
    '</div>' +
    weekTrackHTML +
    '<div class="goal-body">' + bodyInner + '</div>' +
  '</div>';
}

function taskHTML(t) {
  const done = doneTasks.has(t.id);
  return '<div class="task-item' + (done ? ' done' : '') + '">' +
    '<button class="task-check" onclick="event.stopPropagation(); toggleTask(\'' + t.id + '\')">' + (done ? '&#x2713;' : '') + '</button>' +
    '<span class="task-text">' + escHtml(t.text) + '</span>' +
  '</div>';
}

function formatRange(start, end) {
  const s = start.split('-'), e = end.split('-');
  return parseInt(s[1]) + '/' + parseInt(s[2]) + '〜' + parseInt(e[1]) + '/' + parseInt(e[2]);
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
</script>
